name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sidecar:
    name: Sidecar tests & image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pele-render/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix pele-render

      - name: Run tests
        run: npm test --prefix pele-render

      - name: Build sidecar image
        run: docker build -t pele-render:ci ./pele-render

  module:
    name: Module package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module ZIP
        run: scripts/build-module-zip.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pele-diagrams-module
          path: dist/*.zip
          if-no-files-found: error
